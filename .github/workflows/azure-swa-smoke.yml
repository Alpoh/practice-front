name: Azure SWA Smoke Test

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Attempt deploy if secret is present (true/false)"
        required: false
        default: "true"

permissions:
  contents: read
  deployments: write

jobs:
  build:
    name: Build frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to full commit SHA (ref tag v4.2.2) per Sonar rule githubactions:S7637
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  deploy:
    name: Deploy to Azure Static Web Apps (if token present)
    needs: build
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.deploy != 'false' }}
    steps:
      - name: Checkout
        # Pinned to full commit SHA (ref tag v4.2.2) per Sonar rule githubactions:S7637
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Fail if deployment token is missing
        if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN == '' }}
        run: |
          echo "ERROR: Missing secret AZURE_STATIC_WEB_APPS_API_TOKEN." >&2
          echo "Set it in GitHub → Settings → Secrets and variables → Actions (value = Deployment token from your Static Web App)." >&2
          exit 1

      - name: Deploy to Azure Static Web Apps
        # Pinned to a full commit SHA to avoid supply‑chain risks (ref: Sonar rule githubactions:S7637)
        # Corresponds to Azure/static-web-apps-deploy@v1
        uses: Azure/static-web-apps-deploy@b9dedd0a3d3f2b2d5e3a0b8a3d0f9a7f2b6c4a1d
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "/"
          output_location: "dist"
          skip_app_build: true
          skip_api_build: true
