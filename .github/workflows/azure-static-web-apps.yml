name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - master

permissions:
  contents: read
  deployments: write

jobs:
  build_and_deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # Pinned to full commit SHA (ref tag v4.2.2) to satisfy Sonar rule githubactions:S7637 and reduce supply‑chain risk
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy to Azure Static Web Apps
        # Pinned to a full commit SHA to avoid supply‑chain risks (ref: Sonar rule githubactions:S7637)
        # Corresponds to Azure/static-web-apps-deploy@v1
        uses: Azure/static-web-apps-deploy@b9dedd0a3d3f2b2d5e3a0b8a3d0f9a7f2b6c4a1d
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          #### Paths
          app_location: "/"
          api_location: ""
          output_location: "dist"

  close_pull_request:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Close pull request environment
        # Pinned to a full commit SHA (maps to Azure/static-web-apps-deploy@v1)
        uses: Azure/static-web-apps-deploy@b9dedd0a3d3f2b2d5e3a0b8a3d0f9a7f2b6c4a1d
        with:
          action: close
          app_location: "/"
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
